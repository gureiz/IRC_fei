services:

  broker:
    build: ./broker
    container_name: broker

  proxy:
    build: ./proxy
    container_name: proxy

  referencia:
    build: ./referencia
    container_name: referencia
    environment:
      TZ: America/Sao_Paulo

  servidor1:
    build: ./servidor
    container_name: servidor1
    environment:
      SERVER_NAME: servidor1
      TZ: America/Sao_Paulo
    volumes:
      - ./dados/servidor1:/data
    depends_on:
      - broker
      - proxy
      - referencia

  servidor2:
    build: ./servidor
    container_name: servidor2
    environment:
      SERVER_NAME: servidor2
      TZ: America/Sao_Paulo
    volumes:
      - ./dados/servidor2:/data
    depends_on:
      - broker
      - proxy
      - referencia

  cliente1:
    build: ./cliente
    container_name: cliente1
    environment:
      BOT_NAME: bot1
      TZ: America/Sao_Paulo
    depends_on:
      - broker
      - proxy

  cliente2:
    build: ./cliente
    container_name: cliente2
    environment:
      BOT_NAME: bot2
      TZ: America/Sao_Paulo
    depends_on:
      - broker
      - proxy
